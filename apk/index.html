<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taupytukas — atsisiųsti APK</title>
    <meta name="description" content="Taupytukas Android debug APK atsisiuntimas" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08101c;
        --card: rgba(255, 255, 255, 0.04);
        --text: #eef3ff;
        --muted: #9aa8c7;
        --primary: #7c8cff;
        --border: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, rgba(124, 140, 255, 0.18), transparent 42%), var(--bg);
        color: var(--text);
      }
      .card {
        width: min(440px, 100%);
        padding: 28px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--card);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      .button {
        display: inline-block;
        margin-top: 18px;
        padding: 14px 18px;
        border-radius: 16px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .meta {
        margin-top: 16px;
        font-size: 0.9rem;
      }
      code {
        color: var(--text);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="meta">Taupytukas · Android</p>
      <h1>Atsisiųsti APK</h1>
      <p>Spausk mygtuką — atsidarys <strong>Taupytukas-debug.apk</strong> atsisiuntimas.</p>
      <a class="button" id="downloadLink" href="Taupytukas-debug.apk" download="Taupytukas-debug.apk">
        Atsisiųsti Taupytukas-debug.apk
      </a>
      <p class="meta">
        Jei mygtukas neveikia, atidaryk tiesiogiai:
        <br />
        <code id="directLink">Taupytukas-debug.apk</code>
      </p>
    </main>
    <script>
      const apkName = "Taupytukas-debug.apk";
      const apkUrl = new URL(apkName, window.location.href).href;
      document.getElementById("downloadLink").href = apkUrl;
      document.getElementById("directLink").textContent = apkUrl;
      if (window.location.search.includes("auto=1")) {
        window.location.replace(apkUrl);
      }
    </script>
  </body>
</html>
